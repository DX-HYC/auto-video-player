<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 240px; margin: 0; font: 13px/1.5 -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif; background: #fff; color: #222; }
    .wrap { padding: 14px; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .row:last-of-type { border-bottom: none; }
    .hint { color: #999; font-size: 11px; margin-top: 10px; }
    input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
    select { padding: 3px 6px; border: 1px solid #ccc; border-radius: 5px; font-size: 12px; cursor: pointer; }
    button { width: 100%; margin-top: 12px; padding: 8px; border: none; border-radius: 6px; background: #2f81f7; color: #fff; cursor: pointer; font-size: 13px; }
    button:hover { background: #4a93f9; }
    .copyright {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid #eee;
      color: #8a8f98;
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
      user-select: none;
    }
    .copyright b { color: #666; font-weight: 600; }
    .plat-title {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      font-weight: 600;
    }
    .plat-list { margin: 6px 0 2px; }
    .plat {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 8px;
      border: 1px solid #eee;
      border-radius: 6px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .plat input { margin-top: 2px; flex: 0 0 auto; }
    .plat-main { flex: 1 1 auto; }
    .plat-name { font-size: 13px; font-weight: 600; color: #333; }
    .plat-desc { font-size: 11px; color: #999; margin-top: 2px; line-height: 1.4; }
    .plat-frozen {
      font-size: 10px;
      color: #b06a00;
      background: #fff5e0;
      border-radius: 3px;
      padding: 0 4px;
      margin-left: 6px;
    }
    /* 授权卡：未授权时置顶显示，一眼能看到 */
    .lic {
      border: 1px solid #f0c36d;
      background: #fffaf0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .lic.ok { border-color: #7ee2a8; background: #f0fbf5; }
    .lic-status { font-size: 12px; font-weight: 600; margin-bottom: 8px; word-break: break-all; line-height: 1.5; }
    .lic-row { display: flex; gap: 6px; }
    .lic-row input {
      flex: 1 1 auto;
      min-width: 0;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 12px;
    }
    .lic-btn {
      width: auto;
      margin-top: 0;
      padding: 6px 12px;
      font-size: 12px;
      flex: 0 0 auto;
    }
    .lic-meta { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.6; word-break: break-all; }
    .lic-meta b { color: #555; }
    .lic-clear {
      background: none;
      border: none;
      color: #c0392b;
      font-size: 11px;
      padding: 0;
      margin-top: 6px;
      width: auto;
      cursor: pointer;
      text-decoration: underline;
    }
    .lic-clear:hover { background: none; color: #96281b; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>▶ 自动连播助手</h1>
    <div class="lic" id="licBox">
      <div class="lic-status" id="licStatus">授权检测中…</div>
      <div class="lic-row">
        <input type="text" id="licInput" placeholder="输入授权码（可粘贴带连字符的）" spellcheck="false">
        <button class="lic-btn" id="licActivate">激活</button>
      </div>
      <div class="lic-meta" id="licMeta"></div>
    </div>
    <div class="row"><span>总开关</span><input type="checkbox" id="enabled"></div>
    <div class="plat-title">平台启停</div>
    <div class="plat-list" id="platList"></div>
    <div class="row"><span title="刷新页面或跳到下一集后，自动替你点下第一次播放；之后你手动暂停就不再插手">进入页面自动起播</span><input type="checkbox" id="autoStart"></div>
    <div class="row"><span title="部分平台可能检测到非自然播放行为并弹出警告，建议关闭">暂停自动续播 ⚠️</span><input type="checkbox" id="autoResume"></div>
    <div class="row"><span>播完自动下一集</span><input type="checkbox" id="autoNext"></div>
    <div class="row"><span>倍速播放</span><input type="checkbox" id="speedEnabled"></div>
    <div class="row"><span>播放速度</span>
      <select id="playbackRate">
        <option value="1">1.0x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2.0x</option>
        <option value="2.5">2.5x</option>
        <option value="3">3.0x</option>
        <option value="4">4.0x</option>
        <option value="5">5.0x</option>
      </select>
    </div>
    <button id="apply">保存设置</button>
    <div class="hint">设置会实时同步到已打开的页面。</div>
    <div class="copyright">
      <b>© 2026 胡昱晨 (hu_yu_chen)</b><br>
      原创作品 · 保留所有权利 · MIT 授权<br>
      禁止删除作者署名或冒称原创
    </div>
  </div>
  <script src="license.js"></script>
  <script src="popup.js"></script>
</body>
</html>
